<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Éditeur de schémas de principe froid et traitement d'air.">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Schémas Froid &amp; CTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : outil plein écran. Barre d'outils en haut, bibliothèque de symboles à gauche, feuille blanche au centre, propriétés à droite, barre d'état en bas. */
:root{
  --bg:#e8ecf0; --panel:#f6f8fa; --panel-2:#edf1f4; --hover:#e1e7ec;
  --fg:#15202b; --muted:#5a6774; --rule:#d1d8df;
  --accent:#0b6e8e; --accent-soft:#d5eaf2; --accent-ink:#ffffff; --danger:#b4232c;
  --sheet:#ffffff; --grid-minor:#eef1f4; --grid-major:#dbe2e8;
  --f-ui:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-cond:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --panel:#161d23; --panel-2:#1c252c; --hover:#232d35;
  --fg:#e3e9ee; --muted:#8e9ba7; --rule:#2a353e;
  --accent:#4cb0d4; --accent-soft:#163544; --accent-ink:#08161c; --danger:#f0777f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --panel:#161d23; --panel-2:#1c252c; --hover:#232d35;
  --fg:#e3e9ee; --muted:#8e9ba7; --rule:#2a353e;
  --accent:#4cb0d4; --accent-soft:#163544; --accent-ink:#08161c; --danger:#f0777f;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-ui);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
#app{height:100%;display:grid;grid-template-columns:224px minmax(0,1fr) 272px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top top" "pal cv props" "st st st"}

/* Barre d'outils */
.top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:8px;font:600 16px/1 var(--f-cond);letter-spacing:.01em;margin-right:4px;white-space:nowrap}
.brand svg{width:24px;height:24px;color:var(--accent)}
.grp{display:flex;gap:2px;padding:2px;background:var(--panel-2);border:1px solid var(--rule);border-radius:7px}
.btn{appearance:none;border:0;background:transparent;font:500 13px/1 var(--f-ui);padding:7px 10px;border-radius:5px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.38;cursor:default;background:transparent}
.btn kbd{font:500 10px/1 var(--f-mono);opacity:.6}
.btn svg{width:15px;height:15px}
.btn.warn{background:var(--danger);color:#fff}
.btn:focus-visible,.pal-item:focus-visible,.pbtn:focus-visible,.preset:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#zoomv{min-width:58px;justify-content:center;font-family:var(--f-mono);font-size:12px}
.spacer{flex:1}

/* Bibliothèque */
.pal{grid-area:pal;background:var(--panel);border-right:1px solid var(--rule);overflow:auto;padding-bottom:16px}
.pal-search{position:sticky;top:0;background:var(--panel);padding:12px 16px 6px;z-index:1}
.pal-search input{width:100%;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--panel-2)}
.pal-search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.pal-cat{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;cursor:pointer;font:600 11px/1.2 var(--f-ui);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:12px 16px 8px}
.pal-cat::before{content:"";flex:none;width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
.pal-cat[aria-expanded="true"]::before{transform:rotate(90deg)}
.pal-cat span:first-child{flex:1}
.pal-cat .cnt{font:500 10px/1 var(--f-mono);letter-spacing:0}
.pal-cat:hover{color:var(--fg)}
.pal-cat:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pal-item .msk{fill:var(--panel)}
.pal-item:hover .msk{fill:var(--hover)}
.pal-item.on .msk{fill:var(--accent-soft)}
@media (prefers-reduced-motion: reduce){.pal-cat::before{transition:none}}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;padding:4px 16px;border:0;background:none;text-align:left;font:14px/1.2 var(--f-cond);font-weight:500;cursor:grab}
.pal-item:hover{background:var(--hover)}
.pal-item.on{background:var(--accent-soft)}
.pal-item svg{flex:none;width:42px;height:30px}
.pal-empty{padding:8px 16px;color:var(--muted)}

/* Feuille */
.cv{grid-area:cv;position:relative;overflow:hidden;background:var(--sheet)}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#cv.t-line,#cv.t-place{cursor:crosshair}
#cv.t-text{cursor:text}
#cv.t-shape,#cv.t-trim{cursor:crosshair}
#cv.t-pan{cursor:grab}
.btn.ico{padding:7px 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pal-item.st{flex-direction:column;align-items:stretch;gap:3px;padding:6px 16px}
.pal-item.st svg{width:100%;height:34px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;color:#1b1f23}
.pal-item.st .stn{display:flex;align-items:center;gap:6px}
.pal-item.st .stn span:first-child{flex:1;min-width:0}
.tag{font:500 10px/1.4 var(--f-mono);color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:0 4px}
.stdel{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;padding:2px 5px;border-radius:4px;cursor:pointer}
.stdel:hover{background:var(--hover);color:var(--danger)}
.stdel.arm{background:var(--danger);color:#fff;font:600 11px/1.4 var(--f-ui)}
.swatches{gap:6px}
.swb{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--rule);background:var(--c);cursor:pointer;padding:0}
.swb.on{box-shadow:0 0 0 2px var(--accent)}
.pal-empty-st{padding:2px 16px 8px;color:var(--muted);font-size:13px}
#cv.grab{cursor:grab}
#cv.panning{cursor:grabbing}
#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:16px}
#empty[hidden]{display:none}
.empty-card{pointer-events:auto;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;max-width:340px;text-align:center;box-shadow:0 6px 24px rgba(15,30,45,.12)}
.empty-card h3{margin:0 0 6px;font:600 18px/1.2 var(--f-cond);text-wrap:balance}
.empty-card p{margin:0 0 14px;color:var(--muted)}

/* Propriétés */
.props{grid-area:props;background:var(--panel);border-left:1px solid var(--rule);overflow:auto}
.ph{padding:16px 16px 12px;border-bottom:1px solid var(--rule)}
.kind{font:600 11px/1 var(--f-ui);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.ph h2{margin:6px 0 0;font:600 20px/1.15 var(--f-cond);text-wrap:balance}
.note{margin:6px 0 0;color:var(--muted);font-size:13px}
.sec{padding:12px 16px;border-bottom:1px solid var(--rule);display:grid;gap:8px}
.lab{font:600 11px/1 var(--f-ui);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sec input[type=text],.sec textarea{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--panel-2)}
.sec textarea{resize:vertical;min-height:64px}
.sec input[type=number]{width:84px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--panel-2);font-variant-numeric:tabular-nums}
.unit{color:var(--muted);font-size:13px}
.sec input:focus,.sec textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=color]{width:38px;height:32px;padding:2px;border:1px solid var(--rule);border-radius:6px;background:var(--panel-2);cursor:pointer}
.hex{width:96px!important;font-family:var(--f-mono);font-size:12px}
.presets{display:grid;gap:1px}
.preset{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:5px;border:1px solid transparent;background:none;text-align:left;font-size:13px;cursor:pointer}
.preset:hover{background:var(--hover)}
.preset.on{border-color:var(--accent);background:var(--accent-soft)}
.sw{flex:none;display:inline-flex;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:3px 4px}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:2px;background:var(--panel-2);border:1px solid var(--rule);border-radius:6px}
.seg button{flex:1 1 auto;border:0;background:none;padding:6px 8px;border-radius:4px;font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.pbtn{border:1px solid var(--rule);background:var(--panel-2);padding:7px 11px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer}
.pbtn:hover{background:var(--hover)}
.pbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pbtn.danger{color:var(--danger)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;margin:0}
.keys dt{font:500 11px/1.6 var(--f-mono);color:var(--muted);white-space:nowrap}
.keys dd{margin:0}

/* Barre d'état */
.status{grid-area:st;display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;padding:6px 16px;background:var(--panel);border-top:1px solid var(--rule);font:12px/1.4 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.status .hint{font-family:var(--f-ui);font-size:13px;color:var(--fg);flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;border:1px solid var(--rule);background:none;font:500 11px/1.4 var(--f-mono);color:var(--muted);cursor:pointer}
.chip.on{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35}
.chip.on i{background:var(--accent);opacity:1}

#toast{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}

@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(260px,1fr) auto auto auto;grid-template-areas:"top" "cv" "pal" "props" "st"}
  .pal{max-height:150px;border-right:0;border-top:1px solid var(--rule)}
  .props{max-height:32vh;border-left:0;border-top:1px solid var(--rule)}
  .btn kbd,.brand span,.status .hint{display:none}
}
</style>

<div id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="-24 -24 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><circle r="20"/><path d="M-12,-16L19,-6M-12,16L19,6"/></svg>
      <span>Schémas Froid &amp; CTA</span>
    </div>
    <div class="grp" role="group" aria-label="Outils">
      <button class="btn" data-tool="select" aria-pressed="true" title="Sélection (V)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 1.5l9.5 6.2-4.3.9 2.4 4.6-1.7.9-2.4-4.6L3 12.4z"/></svg>Sélection <kbd>V</kbd></button>
      <button class="btn" data-tool="line" aria-pressed="false" title="Liaison (L)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 13V5h7v6h5"/><circle cx="2" cy="13" r="1.4" fill="currentColor"/><circle cx="14" cy="11" r="1.4" fill="currentColor"/></svg>Liaison <kbd>L</kbd></button>
      <button class="btn" data-tool="trim" aria-pressed="false" title="Couper, comme AJUSTER dans AutoCAD (X)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="4" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><path d="M5.6 10.4L12 2M10.4 10.4L4 2"/></svg>Couper <kbd>X</kbd></button>
      <button class="btn" data-tool="text" aria-pressed="false" title="Texte (T)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 2.5h11v2.6h-1.4V3.9H8.7v8.7h1.6V14H5.7v-1.4h1.6V3.9H3.9v1.2H2.5z"/></svg>Texte <kbd>T</kbd></button>
      <button class="btn" data-tool="pan" aria-pressed="false" title="Déplacer la vue (H). Aussi : clic molette ou clic droit maintenu"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 8V3.5a1 1 0 012 0V7m0-4.5a1 1 0 012 0V7m0-3a1 1 0 012 0v3.5m0-1.5a1 1 0 012 0v4c0 2.8-2 4.5-4.5 4.5S5.5 14 4 12L2.6 9.6a1 1 0 011.7-1L5 9.5"/></svg>Main <kbd>H</kbd></button>
    </div>
    <div class="grp" role="group" aria-label="Formes">
      <button class="btn ico" data-shape="rect" aria-pressed="false" title="Rectangle (B)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3.5" width="12" height="9"/></svg><span class="sr">Rectangle</span></button>
      <button class="btn ico" data-shape="seg" aria-pressed="false" title="Trait"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 13.5l11-11"/></svg><span class="sr">Trait</span></button>
      <button class="btn ico" data-shape="ellipse" aria-pressed="false" title="Cercle, ellipse (E)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="8" cy="8" rx="6" ry="5"/></svg><span class="sr">Ellipse</span></button>
      <button class="btn ico" data-shape="tri" aria-pressed="false" title="Triangle"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M8 2.5l6 11H2z"/></svg><span class="sr">Triangle</span></button>
      <button class="btn ico" data-shape="diamond" aria-pressed="false" title="Losange"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M8 1.5l6.5 6.5L8 14.5 1.5 8z"/></svg><span class="sr">Losange</span></button>
    </div>
    <div class="grp" role="group" aria-label="Aides au tracé">
      <button class="btn" id="b-ortho" aria-pressed="true" title="Mode ortho (O ou F8)">Ortho <kbd>O</kbd></button>
      <button class="btn" id="b-grid" aria-pressed="true" title="Grille magnétique (G)">Grille <kbd>G</kbd></button>
    </div>
    <div class="grp" role="group" aria-label="Historique">
      <button class="btn" id="b-undo" title="Annuler (Ctrl+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3L2 6l3 3"/><path d="M2 6h7a4 4 0 010 8H6"/></svg>Annuler</button>
      <button class="btn" id="b-redo" title="Rétablir (Ctrl+Maj+Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 3l3 3-3 3"/><path d="M14 6H7a4 4 0 000 8h3"/></svg>Rétablir</button>
    </div>
    <div class="grp" role="group" aria-label="Zoom">
      <button class="btn" id="b-zout" title="Zoom arrière (-)">−</button>
      <button class="btn" id="zoomv" title="Revenir à 100 %">100 %</button>
      <button class="btn" id="b-zin" title="Zoom avant (+)">+</button>
      <button class="btn" id="b-fit" title="Tout afficher (F)">Ajuster</button>
      <button class="btn ico" id="b-fs" aria-pressed="false" title="Plein écran"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg><span class="sr">Plein écran</span></button>
    </div>
    <div class="spacer"></div>
    <div class="grp" role="group" aria-label="Fichier">
      <button class="btn" id="b-new" title="Vider la feuille">Nouveau</button>
      <button class="btn" id="b-open" title="Ouvrir un fichier .json">Ouvrir</button>
      <button class="btn" id="b-save" title="Enregistrer le projet (.json)">Enregistrer</button>
      <button class="btn" id="b-svg" title="Exporter en SVG">SVG</button>
      <button class="btn" id="b-png" title="Exporter en PNG">PNG</button>
    </div>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </header>

  <aside class="pal" aria-label="Bibliothèque de symboles">
    <div class="pal-search"><input id="q" type="search" placeholder="Chercher un symbole…" autocomplete="off" aria-label="Chercher un symbole"></div>
    <div id="pal-list"></div>
  </aside>

  <main class="cv">
    <svg id="cv" class="t-select" xmlns="http://www.w3.org/2000/svg" aria-label="Feuille de dessin">
      <defs>
        <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path id="gminp" d="M10,0H0V10" fill="none" stroke="#eef1f4" stroke-width="1"/></pattern>
        <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><path id="gmajp" d="M50,0H0V50" fill="none" stroke="#dbe2e8" stroke-width="1"/></pattern>
      </defs>
      <g id="vp">
        <rect id="gridmin" fill="url(#gmin)"/>
        <rect id="gridmaj" fill="url(#gmaj)"/>
        <g id="content"></g>
        <g id="ui" pointer-events="none"></g>
      </g>
    </svg>
    <div id="empty" hidden>
      <div class="empty-card">
        <h3>Feuille vide</h3>
        <p>Glissez un symbole depuis la bibliothèque, puis reliez les ports avec l'outil Liaison.</p>
        <button class="pbtn" id="b-example">Charger l'exemple</button>
      </div>
    </div>
  </main>

  <aside class="props" id="panel" aria-label="Propriétés"></aside>

  <footer class="status">
    <span class="hint" id="st-hint"></span>
    <button class="chip" id="st-ortho"><i></i>ORTHO</button>
    <button class="chip" id="st-grid"><i></i>GRILLE</button>
    <span id="st-xy">x 0 · y 0</span>
  </footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="dwg-symbols.js"></script>
<script>
(()=>{
const G=10, INK='#1b1f23', SEL='#0a84c6', FONT='Arial, Helvetica, sans-serif';
const KEY='schemas-froid-cta:doc', SKEY='schemas-froid-cta:style';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* ---------- Bibliothèque de symboles (coordonnées locales, ports sur la grille de 10) ---------- */
const SYM={};
const CATS=[['af','Accessoires frigorifiques'],['van','Vannes et détendeurs'],['ai','Régulation et instrumentation'],['ah','Hydraulique'],['rac','Raccords'],['cta','Aéraulique et CTA'],['mat','Matériel'],['rep','Repères et annotations']];
function def(type,o){SYM[type]={type,txt:[],lbl:'b',...o}}
const BOW='<path d="M-20,0H-14M14,0H20"/><path d="M-14,-8L14,8V-8L-14,8Z"/>';
const VP=[[-20,0],[20,0]];
const FAN=y=>`<g transform="translate(0,${y})"><circle r="10"/><ellipse rx="8" ry="2.6" transform="rotate(35)"/><ellipse rx="8" ry="2.6" transform="rotate(-55)"/></g>`;
const BOX='<rect x="-20" y="-30" width="40" height="60"/>';
const P4=[[-20,0],[20,0],[0,-30],[0,30]];
const CB=[-20,-30,40,60];
const ZIG='<path d="M-30,0H-24L-20,-12L-14,12L-8,-12L-2,12L4,-12L10,12L16,-12L20,0H30"/>';

/* ---------- Géométrie ---------- */
const SCALES=[0.5,0.75,1,1.5,2,3], SCMIN=0.1, SCMAX=10;
const r2=v=>Math.round(v*100)/100, clampSc=v=>Math.min(SCMAX,Math.max(SCMIN,v));
function rotv(c,x,y){ const k=c.sc||1; x*=k; y*=k; if(c.flip)x=-x; for(let i=0;i<c.rot;i++){const t=x;x=-y;y=t} return [x+0,y+0] }
function tp(c,x,y){ const [a,b]=rotv(c,x,y); return {x:c.x+a,y:c.y+b} }
function ports(c){ return SYM[c.type].ports.map(([x,y])=>{const [a,b]=rotv(c,x,y); return {x:c.x+a,y:c.y+b,d:Math.abs(a)>=Math.abs(b)?'h':'v'}}) }
function bbox(c){ const [bx,by,bw,bh]=SYM[c.type].box; const P=[[bx,by],[bx+bw,by],[bx,by+bh],[bx+bw,by+bh]].map(([x,y])=>tp(c,x,y));
  return {x1:Math.min(...P.map(p=>p.x)),y1:Math.min(...P.map(p=>p.y)),x2:Math.max(...P.map(p=>p.x)),y2:Math.max(...P.map(p=>p.y))} }
function lblPos(c){ const s=SYM[c.type], a=s.lbl==='r'?'start':'middle';
  if(c.lx!=null) return {x:c.x+c.lx,y:c.y+c.ly,a};
  const b=bbox(c);
  if(s.lbl==='r') return {x:b.x2+5,y:c.y+4,a};
  if(s.lbl==='c') return {x:(b.x1+b.x2)/2,y:(b.y1+b.y2)/2+4,a};
  return {x:c.x,y:b.y2+13,a} }
function unit(a,b){const dx=b.x-a.x,dy=b.y-a.y,n=Math.hypot(dx,dy)||1;return [dx/n,dy/n,Math.hypot(dx,dy)]}
function proj(p,a,b){ const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy; let t=L?((p.x-a.x)*dx+(p.y-a.y)*dy)/L:0; t=Math.max(0,Math.min(1,t)); const x=a.x+t*dx,y=a.y+t*dy; return {x,y,d:Math.hypot(p.x-x,p.y-y)} }
function onSeg(p,a,b){ return proj(p,a,b).d<0.5 }
const snapv=v=>grid?Math.round(v/G)*G:Math.round(v);
const snapG=p=>({x:snapv(p.x),y:snapv(p.y)});
const same=(a,b)=>a.x===b.x&&a.y===b.y;

/* ---------- Rendu SVG ---------- */
function symMarkup(s,ink){ return s.svg.replaceAll('{K}',ink) }
// Textes intégrés au symbole : toujours horizontaux. Entrée [x,y,texte,taille,ancrage,'n'] ('n' = ligne de base et graisse normale, textes DWG)
function symTexts(s,pos,k,ink){ let h='';
  for(const [x,y,t,fs,an,w] of s.txt){ const p=pos(x,y), f=fs*k, yb=w==='n'?p.y:p.y+f*0.36;
    h+=`<text x="${p.x.toFixed(1)}" y="${yb.toFixed(1)}" text-anchor="${an||'middle'}" font-family="${FONT}" font-size="${f.toFixed(1)}"${w==='n'?'':' font-weight="bold"'} fill="${ink}" stroke="none">${esc(t)}</text>` }
  return h }
function compSVG(c,exp){
  const s=SYM[c.type], [bx,by,bw,bh]=s.box, k=c.sc||1;
  let h=`<g class="comp" data-id="${c.id}"><g transform="translate(${c.x},${c.y}) rotate(${c.rot*90}) scale(${(c.flip?-1:1)*k},${k})" fill="none" stroke="${INK}" stroke-width="${((s.sw||1.5)/k).toFixed(2)}" stroke-linejoin="round" stroke-linecap="round">`;
  if(!exp) h+=`<rect x="${bx-4}" y="${by-4}" width="${bw+8}" height="${bh+8}" fill="#fff" fill-opacity="0" stroke="none"/>`;
  h+=symMarkup(s,INK)+'</g>';
  h+=symTexts(s,(x,y)=>tp(c,x,y),k,INK);
  if(c.label){const L=lblPos(c); h+=`<text${exp?'':` data-lbl="${c.id}" style="cursor:move"`} x="${L.x}" y="${L.y}" text-anchor="${L.a}" font-family="${FONT}" font-size="11" font-weight="bold" fill="${INK}">${esc(c.label)}</text>`}
  return h+'</g>';
}
function dashArr(l){ const w=l.width; return l.dash==='dash'?`${4+3*w} ${2+2*w}`:l.dash==='dot'?`0.1 ${2.5*w+2}`:'' }
function arrowPoly(tip,dx,dy,l){ const L=6+l.width*2, W=2.5+l.width, bx=tip.x-dx*L, by=tip.y-dy*L;
  return `<polygon points="${tip.x.toFixed(1)},${tip.y.toFixed(1)} ${(bx-dy*W).toFixed(1)},${(by+dx*W).toFixed(1)} ${(bx+dy*W).toFixed(1)},${(by-dx*W).toFixed(1)}" fill="${l.color}"/>` }
function arrows(l){ const P=l.pts,n=P.length; if(n<2||l.arrow==='none') return ''; let h='';
  if(l.arrow==='end'||l.arrow==='both'){const [dx,dy]=unit(P[n-2],P[n-1]); h+=arrowPoly(P[n-1],dx,dy,l)}
  if(l.arrow==='start'||l.arrow==='both'){const [dx,dy]=unit(P[1],P[0]); h+=arrowPoly(P[0],dx,dy,l)}
  if(l.arrow==='mid') for(let i=0;i<n-1;i++){ const [dx,dy,len]=unit(P[i],P[i+1]); if(len<34) continue; const L=6+l.width*2;
    h+=arrowPoly({x:(P[i].x+P[i+1].x)/2+dx*L/2,y:(P[i].y+P[i+1].y)/2+dy*L/2},dx,dy,l) }
  return h }
function dots(l){ let h=''; // point de piquage quand une extrémité libre tombe sur une autre liaison
  if(l.contour) return h;
  for(const [p,at] of [[l.pts[0],l.a],[l.pts.at(-1),l.b]]){ if(at) continue;
    for(const o of doc.lines){ if(o===l||o.contour) continue; const P=o.pts; if(same(p,P[0])||same(p,P.at(-1))) continue;
      let hit=false; for(let i=0;i<P.length-1;i++) if(onSeg(p,P[i],P[i+1])){hit=true;break}
      if(hit){ h+=`<circle cx="${p.x}" cy="${p.y}" r="${2+o.width}" fill="${o.color}"/>`; break } } }
  return h }
function lineSVG(l,exp){
  const pts=l.pts.map(p=>p.x+','+p.y).join(' '), da=dashArr(l);
  let h=`<g class="line" data-id="${l.id}">`;
  if(!exp) h+=`<polyline points="${pts}" fill="none" stroke="#000" stroke-opacity="0" stroke-width="${Math.max(l.width+6,10/view.z).toFixed(2)}"/>`;
  h+=`<polyline points="${pts}" fill="none" stroke="${l.color}" stroke-width="${l.width}" stroke-linejoin="miter" stroke-linecap="${l.dash==='dot'?'round':'butt'}"${da?` stroke-dasharray="${da}"`:''}/>`;
  return h+arrows(l)+dots(l)+'</g>' }
function textSVG(t){ const L=String(t.text).split('\n');
  return `<text class="txt" data-id="${t.id}" x="${t.x}" y="${t.y}" font-family="${FONT}" font-size="${t.size}"${t.bold?' font-weight="bold"':''} fill="${t.color}">`+
    L.map((s,i)=>`<tspan x="${t.x}"${i?' dy="1.25em"':''}>${esc(s)||' '}</tspan>`).join('')+'</text>' }
function shapeEl(s,attrs){ const {x,y,w,h}=s;
  if(s.k==='ellipse') return `<ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${w/2}" ry="${h/2}" ${attrs}/>`;
  if(s.k==='tri') return `<polygon points="${x+w/2},${y} ${x+w},${y+h} ${x},${y+h}" ${attrs}/>`;
  if(s.k==='diamond') return `<polygon points="${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}" ${attrs}/>`;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}"${s.r?` rx="${Math.min(10,w/4,h/4)}"`:''} ${attrs}/>` }
function shapeSVG(s,exp){ const da=dashArr(s);
  let h=`<g class="shape" data-id="${s.id}">`;
  h+=shapeEl(s,`fill="${s.tint?s.color:'none'}"${s.tint?' fill-opacity=".12"':''} stroke="${s.color}" stroke-width="${s.width}"${da?` stroke-dasharray="${da}"`:''} stroke-linejoin="round"`);
  if(!exp) h+=shapeEl(s,`fill="none" stroke="#000" stroke-opacity="0" stroke-width="${Math.max(s.width+6,10/view.z).toFixed(2)}"`);
  if(s.text) h+=`<text x="${s.x+s.w/2}" y="${s.y+s.h/2+4}" text-anchor="middle" font-family="${FONT}" font-size="12" fill="${INK}">${esc(s.text)}</text>`;
  return h+'</g>' }
function scene(exp){ return doc.shapes.map(s=>shapeSVG(s,exp)).join('')+doc.lines.map(l=>lineSVG(l,exp)).join('')+doc.comps.map(c=>compSVG(c,exp)).join('')+doc.texts.map(textSVG).join('') }

function renderView(){
  const z=view.z, W=svg.clientWidth, H=svg.clientHeight;
  vp.setAttribute('transform',`translate(${view.x},${view.y}) scale(${z})`);
  const x0=-view.x/z, y0=-view.y/z;
  for(const id of ['gridmin','gridmaj']){ const r=$('#'+id); r.setAttribute('x',x0); r.setAttribute('y',y0); r.setAttribute('width',W/z); r.setAttribute('height',H/z) }
  $('#gminp').setAttribute('stroke-width',1/z); $('#gmajp').setAttribute('stroke-width',1/z);
  $('#gridmin').style.display=(grid&&z>=0.45)?'':'none'; $('#gridmaj').style.display=grid?'':'none';
  $('#zoomv').textContent=Math.round(z*100)+' %';
}
function renderContent(){ content.innerHTML=scene(false) }
function renderUI(){

function insertItems(items,dx,dy){ const map={}, ids=[];
  for(const c of items.comps||[]){ ensureType(c.type); const n={...clone(c),id:'c'+seq++,x:c.x+dx,y:c.y+dy,sc:c.sc||1,label:c.label?nextLabel(c.type):''}; map[c.id]=n.id; doc.comps.push(n); ids.push(n.id) }
  for(const t of items.texts||[]){ const n={...clone(t),id:'t'+seq++,x:t.x+dx,y:t.y+dy}; doc.texts.push(n); ids.push(n.id) }
  for(const s of items.shapes||[]){ const n={...clone(s),id:'s'+seq++,x:s.x+dx,y:s.y+dy}; doc.shapes.push(n); ids.push(n.id) }
  for(const l of items.lines||[]){ const n={...clone(l),id:'l'+seq++,pts:l.pts.map(p=>({x:p.x+dx,y:p.y+dy}))};
    n.a=l.a&&map[l.a.c]?{c:map[l.a.c],p:l.a.p}:null; n.b=l.b&&map[l.b.c]?{c:map[l.b.c],p:l.b.p}:null; doc.lines.push(n); ids.push(n.id) }
  return ids }
function paste(items,dx,dy){ if(!items) return; sel=new Set(insertItems(items,dx,dy)); commit(); renderAll(); buildPanel() }

/* ---------- Stations de vannes ---------- */
function itemsBox(it){ const xs=[],ys=[];
  for(const c of it.comps||[]){ const b=bbox(c); xs.push(b.x1,b.x2); ys.push(b.y1,b.y2) }
  for(const l of it.lines||[]) for(const p of l.pts){ xs.push(p.x); ys.push(p.y) }
  for(const t of it.texts||[]){ xs.push(t.x,t.x+String(t.text).length*t.size*0.55); ys.push(t.y-t.size,t.y) }
  for(const s of it.shapes||[]){ xs.push(s.x,s.x+s.w); ys.push(s.y,s.y+s.h) }
  if(!xs.length) return null;
  return {x1:Math.min(...xs),y1:Math.min(...ys),x2:Math.max(...xs),y2:Math.max(...ys)} }
function centerItems(it){ const b=itemsBox(it); if(!b) return it; const ax=Math.round((b.x1+b.x2)/2/G)*G, ay=Math.round((b.y1+b.y2)/2/G)*G;
  (it.comps||[]).forEach(c=>{c.x-=ax;c.y-=ay}); (it.texts||[]).forEach(t=>{t.x-=ax;t.y-=ay}); (it.shapes||[]).forEach(s=>{s.x-=ax;s.y-=ay});
  (it.lines||[]).forEach(l=>l.pts.forEach(p=>{p.x-=ax;p.y-=ay})); return it }
function rotItems(it){ const r=(x,y)=>[-y,x];
  (it.comps||[]).forEach(c=>{ [c.x,c.y]=r(c.x,c.y); c.rot=(c.rot+1)%4; c.lx=c.ly=null });
  (it.lines||[]).forEach(l=>l.pts.forEach(p=>{ [p.x,p.y]=r(p.x,p.y) }));
  (it.texts||[]).forEach(t=>{ [t.x,t.y]=r(t.x,t.y) });
  (it.shapes||[]).forEach(s=>{ const nx=-(s.y+s.h), ny=s.x; s.x=nx; s.y=ny; [s.w,s.h]=[s.h,s.w] });
  return it }
function itemsSVG(it){ // aperçu (palette, fantôme) sans repères
  let h=(it.shapes||[]).map(s=>shapeSVG(s,true)).join('');
  for(const l of it.lines||[]){ const da=dashArr(l); h+=`<polyline points="${l.pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="${l.color}" stroke-width="${l.width}"${da?` stroke-dasharray="${da}"`:''}/>` }
  h+=(it.comps||[]).map(c=>compSVG({...c,label:''},true)).join('');
  return h+(it.texts||[]).map(textSVG).join('') }
// Ports horizontaux d'entrée et de sortie d'un symbole (paire de ports alignés la plus large)
function axisPorts(type){ const P=(SYM[type]||{}).ports||[]; let best=null;
  for(let i=0;i<P.length;i++) for(let j=0;j<P.length;j++){ if(i===j||P[i][1]!==P[j][1]||P[j][0]<=P[i][0]) continue;
    const d=P[j][0]-P[i][0]; if(!best||d>best.d||(d===best.d&&Math.abs(P[i][1])<Math.abs(best.y))) best={d,i,j,y:P[i][1]} }
  return best?{L:best.i,R:best.j,Lp:P[best.i],Rp:P[best.j]}:null }
// Construit une ligne de composants raccordés en série, de gauche à droite, sur l'axe y
function chainItems(list,y,opt={}){ const it={comps:[],lines:[],texts:[],shapes:[]}; let n=1, x=0, prev=null;
  const st=k=>({...{color:'#1b1f23',width:2,dash:'solid',arrow:'none'},...(opt.styles&&opt.styles[k]||opt.style||{})});
  const gap=opt.gap||20, stub=opt.stub||30; let seg=0;
  for(const name of list){ const type='dwg:'+name, ap=axisPorts(type); if(!ap) continue;
    const lx=prev?prev.x+gap:x+stub, c={id:'k'+n++,type,x:lx-ap.Lp[0],y:y-ap.Lp[1],rot:0,flip:false,sc:1,label:'x',lx:null,ly:null};
    it.comps.push(c);
    const L={x:lx,y}, R={x:c.x+ap.Rp[0],y};
    if(prev) it.lines.push({id:'k'+n++,pts:[{x:prev.x,y},L],a:{c:prev.c,p:prev.p},b:{c:c.id,p:ap.L},...st(seg++)});
    else it.lines.push({id:'k'+n++,pts:[{x,y},L],a:null,b:{c:c.id,p:ap.L},...st(seg++)});
    prev={x:R.x,c:c.id,p:ap.R} }
  if(prev) it.lines.push({id:'k'+n++,pts:[{x:prev.x,y},{x:prev.x+stub,y}],a:{c:prev.c,p:prev.p},b:null,...st(seg)});
  it.end=prev?prev.x+stub:x; it.n=n; return it }
function addPilot(it,compIdx){ const c=it.comps[compIdx]; if(!c||!SYM['dwg:SH-VAN-30-Pilote_electrique']) return; const b=bbox(c);
  it.comps.push({id:'kp'+compIdx,type:'dwg:SH-VAN-30-Pilote_electrique',x:Math.round(((b.x1+b.x2)/2)/G)*G,y:Math.round((b.y1-10)/G)*G,rot:0,flip:false,sc:1,label:'',lx:null,ly:null}) }
const LIQ={color:'#e67e00',width:2,dash:'solid',arrow:'mid'}, MIXS={color:'#5aa2e6',width:2,dash:'solid',arrow:'mid'}, EGS={color:'#0094a8',width:2,dash:'solid',arrow:'mid'};
function presetStations(){ const out=[];
  const isol='SH-VAN-05-vanne_ff_isol_droite';
  { const it=chainItems([isol,'SH-AF-04-déshy-non rech.','SH-AF-11-voyant','SH-VAN-31-vanne pilote','SH-VAN-34-detendeur_thermostat',isol],0,{styles:{0:LIQ,1:LIQ,2:LIQ,3:LIQ,4:LIQ,5:MIXS,6:MIXS}});
    addPilot(it,3); if(it.comps.length>=5) out.push({id:'p-detente',name:'Station de détente',items:it}) }
  { const it=chainItems([isol,'SH-ANH-01-filtre sans brides','SH-VAN-31-vanne pilote',isol],0,{style:LIQ});
    addPilot(it,2);
    const bp='dwg:SH-VAN-08-Rob_a_soupape', ap=axisPorts(bp);
    if(ap&&it.comps.length>=3){ const yb=-70, xin=10, xout=it.end-10, w=ap.Rp[0]-ap.Lp[0], lx=Math.round(((xin+xout)/2-w/2)/G)*G;
      const c={id:'kb',type:bp,x:lx-ap.Lp[0],y:yb-ap.Lp[1],rot:0,flip:false,sc:1,label:'x',lx:null,ly:null}; it.comps.push(c);
      it.lines.push({id:'kb1',pts:[{x:xin,y:0},{x:xin,y:yb},{x:lx,y:yb}],a:null,b:{c:'kb',p:ap.L},...LIQ});
      it.lines.push({id:'kb2',pts:[{x:lx+w,y:yb},{x:xout,y:yb},{x:xout,y:0}],a:{c:'kb',p:ap.R},b:null,...LIQ}) }
    if(it.comps.length>=4) out.push({id:'p-bypass',name:'Électrovanne avec by-pass',items:it}) }
  { const av='SH-AH-14-anti-vibratile';
    const it=chainItems([isol,'SH-AH-04-filtre à brides',av,'SH-AH-18-pompe',av,'SH-AH-02-clapet à brides',isol],0,{style:EGS});
    if(it.comps.length>=5) out.push({id:'p-pompe',name:'Station de pompage',items:it}) }
  { const it=chainItems([isol,'SH-AH-04-filtre à brides','SH-VAN-19-V2V_a_siege','SH-VAN-10-Rob_reglage_TA',isol],0,{style:EGS});
    if(it.comps.length>=4) out.push({id:'p-reglage',name:'Station de réglage (V2V + TA)',items:it}) }

const PRESETS_ST=presetStations();
const STKEY='schemas-froid-cta:stations';
let customStations=[], stDb=null;
const validSt=s=>s&&typeof s.name==='string'&&s.items&&Array.isArray(s.items.comps)&&Array.isArray(s.items.lines);
try{ const a=JSON.parse(localStorage.getItem(STKEY)||'[]'); if(Array.isArray(a)) customStations=a.filter(validSt) }catch(e){}
const saveLocalSt=()=>{ try{ localStorage.setItem(STKEY,JSON.stringify(customStations.filter(s=>String(s.id).startsWith('loc')))) }catch(e){} };
const dbP=(window.claude&&typeof window.claude.use==='function')?window.claude.use('db').catch(()=>null):Promise.resolve(null);
dbP.then(db=>{ if(!db) return;
  try{ db.collection('stations').onSnapshot(snap=>{ stDb=db;
      const remote=snap.docs.map(d=>({id:d.id,...d.data()})).filter(validSt);
      customStations=[...remote,...customStations.filter(s=>String(s.id).startsWith('loc'))]; buildPalette() },
    ()=>{ stDb=null }) }catch(e){ stDb=null } });
function allStations(){ return [...PRESETS_ST,...customStations] }
function findStation(id){ return allStations().find(s=>s.id===id) }
async function saveStation(name){ const it=centerItems(clone(copySel()||{}));
  if(!it.comps||!it.comps.length&&!it.lines.length) return toast('Sélectionnez au moins un composant ou une liaison.');
  const st={name,items:{comps:it.comps,lines:it.lines,texts:it.texts||[],shapes:it.shapes||[]},created:Date.now()};
  if(stDb){ try{ await stDb.collection('stations').add(st); toast('Station « '+name+' » enregistrée.'); return }catch(e){} }
  customStations.push({id:'loc'+Date.now(),...st}); saveLocalSt(); buildPalette(); toast('Station « '+name+' » enregistrée dans ce navigateur.') }

  if(d.mode==='band'){ const x1=Math.min(d.p0.x,d.p1.x),x2=Math.max(d.p0.x,d.p1.x),y1=Math.min(d.p0.y,d.p1.y),y2=Math.max(d.p0.y,d.p1.y);
    if(x2-x1>2||y2-y1>2){ const inn=q=>q.x>=x1&&q.x<=x2&&q.y>=y1&&q.y<=y2;
      doc.comps.forEach(c=>{const b=bbox(c); if(b.x1>=x1&&b.x2<=x2&&b.y1>=y1&&b.y2<=y2) sel.add(c.id)});
      doc.lines.forEach(l=>{ if(l.pts.every(inn)) sel.add(l.id) }); doc.texts.forEach(t=>{ if(inn(t)) sel.add(t.id) });
      doc.shapes.forEach(s=>{ if(inn(s)&&inn({x:s.x+s.w,y:s.y+s.h})) sel.add(s.id) }) }
    buildPanel() }
  else if(d.mode==='move'){ d.ls.forEach(fixAttach); d.aff.forEach(simplify); if(d.moved) commit() }
  else if(d.mode==='seg'){ simplify(d.l); fixAttach(d.l); if(d.moved) commit(); buildPanel() }
  else if(d.mode==='vertex'){ simplify(d.l); if(d.moved) commit(); buildPanel() }
  else if(d.mode==='label'){ if(d.moved){ commit(); buildPanel() } }
  renderAll() }
svg.addEventListener('pointerup',endDrag);
svg.addEventListener('pointercancel',endDrag);
svg.addEventListener('pointerleave',()=>{ if(!drag&&(tool==='line'||tool==='trim'||placing)){ if(placing) placing.p=null; if(!draft) hover=null; renderUI() } });
svg.addEventListener('dblclick',e=>{ if(tool!=='select'||placing) return; const p=world(e);
  const hd=e.target.closest('[data-h]');
  if(hd){ const [id,i]=hd.dataset.h.split(':'); const l=get(id); if(l&&l.pts.length>2&&+i>0&&+i<l.pts.length-1){ l.pts.splice(+i,1); commit(); renderAll(); buildPanel() } return }
  const it=e.target.closest('[data-id]'), lb=e.target.closest('[data-lbl]');
  if(lb||(it&&it.dataset.id[0]==='c')){ const f=$('#p-label'); if(f){f.focus(); f.select()} return }
  if(!it) return; const id=it.dataset.id;
  if(id[0]==='t'){ const f=$('#p-text'); if(f){f.focus(); f.select()} return }
  if(id[0]==='s'){ const f=$('#p-stext'); if(f){f.focus(); f.select()} return }
  if(id[0]==='l'){ const l=get(id), P=l.pts; let bi=0,bd=1e9,bp=null;
    for(let i=0;i<P.length-1;i++){ const r=proj(p,P[i],P[i+1]); if(r.d<bd){bd=r.d;bi=i;bp=r} }
    const a=P[bi],b=P[bi+1]; const q={x:a.x===b.x?a.x:snapv(bp.x),y:a.y===b.y?a.y:snapv(bp.y)};
    if(!same(q,a)&&!same(q,b)){ P.splice(bi+1,0,q); renderAll(); toast('Point ajouté. Glissez la poignée pour former un coude.') } }
});
svg.addEventListener('wheel',e=>{ e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015))) },{passive:false});
function zoomAt(sx,sy,f){ const z=Math.max(0.15,Math.min(6,view.z*f)); const wx=(sx-view.x)/view.z, wy=(sy-view.y)/view.z; view.z=z; view.x=sx-wx*z; view.y=sy-wy*z; renderAll() }
function contentBox(){ const b=content.getBBox(); return (b.width||b.height)?b:null }
function fit(){ renderContent(); const b=contentBox(), W=svg.clientWidth, H=svg.clientHeight;
  if(!b||!W){ view={x:W/2,y:H/2,z:1}; renderAll(); return }
  const z=Math.max(0.15,Math.min(2,Math.min((W-80)/b.width,(H-80)/b.height)));
  view={z,x:W/2-(b.x+b.width/2)*z,y:H/2-(b.y+b.height/2)*z}; renderAll() }

/* ---------- Outils, statut ---------- */
function setTool(t,kind){ if(draft) finishDraft(); tool=t; placing=null; hover=null; if(kind) shapeKind=kind;
  document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===t)));
  document.querySelectorAll('[data-shape]').forEach(b=>b.setAttribute('aria-pressed',String(t==='shape'&&b.dataset.shape===shapeKind)));
  svg.className.baseVal='t-'+t; buildPalette(); renderUI(); status() }
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
document.querySelectorAll('[data-shape]').forEach(b=>b.addEventListener('click',()=>setTool('shape',b.dataset.shape)));
function toggleOrtho(){ ortho=!ortho; if(draft&&lastP) lineHover(lastP); status(); toast(ortho?'Mode ortho activé':'Mode ortho désactivé') }
function toggleGrid(){ grid=!grid; renderView(); status() }
$('#b-ortho').onclick=toggleOrtho; $('#st-ortho').onclick=toggleOrtho; $('#b-grid').onclick=toggleGrid; $('#st-grid').onclick=toggleGrid;
function status(){
  $('#b-ortho').setAttribute('aria-pressed',String(ortho)); $('#st-ortho').classList.toggle('on',ortho);
  $('#b-grid').setAttribute('aria-pressed',String(grid)); $('#st-grid').classList.toggle('on',grid);
  let h;
  const PAN=' Clic molette ou clic droit maintenu pour déplacer la vue.';
  if(placing) h=`Cliquez sur la feuille pour poser « ${placing.st?(findStation(placing.st)||{}).name:SYM[placing.type].name} ». R tourne avant de poser, Maj+clic en pose plusieurs, Échap annule.`;
  else if(tool==='shape'&&shapeKind==='seg') h=`Glissez pour tracer un trait. ${ortho?'Ortho actif : horizontal ou vertical.':'Ortho coupé : trait libre.'} Maj inverse l'ortho. Un simple clic pose un trait de 80.`;
  else if(tool==='shape') h=`Glissez pour dessiner : ${SHAPE_NAMES[shapeKind].toLowerCase()}. Maj pour un carré ou un cercle. Un simple clic pose une forme par défaut.`;
  else if(tool==='pan') h='Glissez pour déplacer la vue. V pour revenir à la sélection.';
  else if(tool==='trim') h="Cliquez sur le morceau de liaison ou de contour de forme à retirer (en rouge) : il est coupé aux croisements les plus proches. Deux formes qui se chevauchent : coupez l'intérieur de chacune pour garder le contour extérieur. Ctrl+Z annule, Échap pour finir.";
  else if(tool==='line') h=draft?`Cliquez pour ajouter un point. Un clic sur un port ou une liaison termine. Double-clic, Entrée ou clic droit pour finir. Retour arrière retire le dernier point.`
                               :`Cliquez sur un port (rond bleu) ou n'importe où pour commencer la liaison. ${ortho?'Ortho actif : tracés horizontaux et verticaux.':'Ortho coupé : tracé libre.'} Maj inverse l'ortho.`;
  else if(tool==='text') h='Cliquez sur la feuille pour placer un texte.';
  else h='Glissez pour déplacer. Ctrl+clic pour sélectionner plusieurs éléments. Glissez un tronçon de liaison pour le décaler.'+PAN;
  $('#st-hint').textContent=h }
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2400) }

/* ---------- Clavier ---------- */
window.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName), mod=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(e.key==='Shift'&&!shiftDown){ shiftDown=true; if(tool==='line'&&lastP&&!typing) lineHover(lastP) }
  if(typing){ if(e.key==='Escape') e.target.blur(); return }
  if(mod){
    if(k==='z'){ e.preventDefault(); e.shiftKey?redo():undo() }
    else if(k==='y'){ e.preventDefault(); redo() }
    else if(k==='c'){ clip=copySel() }
    else if(k==='x'){ clip=copySel(); delSel() }
    else if(k==='v'){ paste(clip,20,20) }
    else if(k==='d'){ e.preventDefault(); paste(copySel(),20,20) }
    else if(k==='a'){ e.preventDefault(); sel=new Set([...doc.comps,...doc.lines,...doc.texts,...doc.shapes].map(o=>o.id)); buildPanel(); renderUI() }
    else if(k==='s'){ e.preventDefault(); saveJSON() }
    return }
  if(e.code==='Space'){ e.preventDefault(); if(!space){ space=true; svg.classList.add('grab') } return }
  switch(e.key){
    case 'v': case 'V': setTool('select'); break;
    case 'l': case 'L': setTool('line'); break;
    case 't': case 'T': setTool('text'); break;
    case 'h': case 'H': setTool('pan'); break;
    case 'x': case 'X': setTool('trim'); break;
    case 'b': case 'B': setTool('shape','rect'); break;
    case 'e': case 'E': setTool('shape','ellipse'); break;
    case 'o': case 'O': case 'F8': e.preventDefault(); toggleOrtho(); break;
    case 'g': case 'G': toggleGrid(); break;
    case 'r': case 'R': if(placing){ if(placing.st){ rotItems(placing.items); if(e.shiftKey){ rotItems(placing.items); rotItems(placing.items) } } else placing.rot=(placing.rot+(e.shiftKey?3:1))%4; renderUI() } else rotateSel(e.shiftKey); break;
    case 'm': case 'M': flipSel(); buildPanel(); break;
    case 'f': case 'F': fit(); break;
    case '+': case '=': zoomAt(svg.clientWidth/2,svg.clientHeight/2,1.25); break;
    case '-': case '_': zoomAt(svg.clientWidth/2,svg.clientHeight/2,0.8); break;
    case 'Enter': if(draft) finishDraft(); break;
    case 'Delete': case 'Backspace': e.preventDefault();
      if(draft){ draft.pts.pop(); if(!draft.pts.length){ draft=null; hover=null } else if(lastP) lineHover(lastP); renderUI(); status() } else delSel(); break;
    case 'Escape':
      if(draft){ draft.pts.length>=2?finishDraft():(draft=null,hover=null,renderUI()); status() }
      else if(placing){ placing=null; buildPalette(); svg.classList.remove('t-place'); renderUI(); status() }
      else if(sel.size){ sel=new Set(); buildPanel(); renderUI() }
      else if(tool!=='select') setTool('select'); break;
    case 'ArrowLeft': e.preventDefault(); nudge(e.altKey?-1:-G,0); break;
    case 'ArrowRight': e.preventDefault(); nudge(e.altKey?1:G,0); break;
    case 'ArrowUp': e.preventDefault(); nudge(0,e.altKey?-1:-G); break;
    case 'ArrowDown': e.preventDefault(); nudge(0,e.altKey?1:G); break;
  } });
window.addEventListener('keyup',e=>{
  if(e.key==='Shift'){ shiftDown=false; if(tool==='line'&&lastP) lineHover(lastP) }
  if(e.code==='Space'){ space=false; svg.classList.remove('grab') } });
window.addEventListener('blur',()=>{ space=false; shiftDown=false; svg.classList.remove('grab') });

/* ---------- Fichiers et exports ---------- */
const dlP=(window.claude&&typeof window.claude.use==='function')?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
async function saveFile(name,data){
  const dl=await dlP;
  if(dl){ try{ await dl.save({filename:name,data}); toast('Fichier enregistré : '+name) }
    catch(err){ const c=err&&err.code; if(c==='declined') return; toast(c==='rate_limited'?'Une demande est déjà ouverte, réessayez dans un instant.':"L'enregistrement n'est pas disponible ici.") } return }
  try{ const blob=data instanceof Blob?data:new Blob([data]); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000) }
  catch(err){ toast("L'enregistrement n'est pas disponible ici.") } }
function saveJSON(){ saveFile('schema-froid-cta.json',JSON.stringify({app:'schemas-froid-cta',version:1,...doc},null,1)) }
function buildSVG(){ renderContent(); const b=contentBox(); if(!b) return null; const m=24, x=Math.floor(b.x-m), y=Math.floor(b.y-m), w=Math.ceil(b.width+2*m), h=Math.ceil(b.height+2*m);
  return {w,h,svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="${x} ${y} ${w} ${h}"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#ffffff"/>${scene(true)}</svg>`} }
function exportSVG(){ const r=buildSVG(); if(!r) return toast('La feuille est vide.'); saveFile('schema-froid-cta.svg',r.svg) }
function exportPNG(){ const r=buildSVG(); if(!r) return toast('La feuille est vide.'); const img=new Image();
  img.onload=()=>{ const k=2, cv=document.createElement('canvas'); cv.width=r.w*k; cv.height=r.h*k; const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>b?saveFile('schema-froid-cta.png',b):toast("L'export PNG a échoué."),'image/png') };
  img.onerror=()=>toast("L'export PNG a échoué.");
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(r.svg) }
function normDoc(d){ if(!d||!Array.isArray(d.comps)||!Array.isArray(d.lines)) throw new Error('format');
  const hex=c=>/^#[0-9a-f]{6}$/i.test(c)?c:INK;
  return {
    comps:d.comps.filter(c=>c&&typeof c.type==='string').map(c=>{ ensureType(c.type); return {id:String(c.id),type:c.type,x:+c.x||0,y:+c.y||0,rot:(((c.rot|0)%4)+4)%4,flip:!!c.flip,sc:clampSc(+c.sc||1),label:String(c.label??''),lx:c.lx==null?null:+c.lx,ly:c.ly==null?null:+c.ly} }),
    lines:d.lines.filter(l=>l&&Array.isArray(l.pts)&&l.pts.length>=2).map(l=>({id:String(l.id),pts:l.pts.map(p=>({x:+p.x||0,y:+p.y||0})),
      a:l.a&&l.a.c!=null?{c:String(l.a.c),p:l.a.p|0}:null,b:l.b&&l.b.c!=null?{c:String(l.b.c),p:l.b.p|0}:null,
      color:hex(l.color),width:[1,2,3,4].includes(l.width)?l.width:2,dash:['solid','dash','dot'].includes(l.dash)?l.dash:'solid',arrow:ARROWS.some(a=>a[0]===l.arrow)?l.arrow:'none',...(l.contour?{contour:l.contour==='trait'?'trait':true}:{})})),
    texts:(Array.isArray(d.texts)?d.texts:[]).map(t=>({id:String(t.id),x:+t.x||0,y:+t.y||0,text:String(t.text??''),size:+t.size||12,color:hex(t.color),bold:!!t.bold})),
    shapes:(Array.isArray(d.shapes)?d.shapes:[]).filter(s=>s&&SHAPE_NAMES[s.k]).map(s=>({id:String(s.id),k:s.k,x:+s.x||0,y:+s.y||0,w:Math.max(2,+s.w||80),h:Math.max(2,+s.h||60),
      color:hex(s.color),width:[1,2,3,4].includes(s.width)?s.width:2,dash:['solid','dash','dot'].includes(s.dash)?s.dash:'solid',tint:!!s.tint,r:!!s.r,text:String(s.text??'')})) } }
function loadDoc(d){ doc=d; resetSeq(); sel=new Set(); draft=null; commit(); fit(); buildPanel() }
$('#b-save').onclick=saveJSON; $('#b-svg').onclick=exportSVG; $('#b-png').onclick=exportPNG;
$('#b-open').onclick=()=>$('#file').click();
$('#file').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ loadDoc(normDoc(JSON.parse(r.result))); toast('Projet ouvert : '+f.name) }catch(err){ toast("Ce fichier n'est pas un projet de schéma valide.") } e.target.value='' };
  r.readAsText(f) });
let newArm=0;
$('#b-new').onclick=()=>{ const b=$('#b-new');
  if(!newArm){ newArm=setTimeout(()=>{newArm=0; b.textContent='Nouveau'; b.classList.remove('warn')},3000); b.textContent='Tout effacer ?'; b.classList.add('warn'); return }
  clearTimeout(newArm); newArm=0; b.textContent='Nouveau'; b.classList.remove('warn');
  loadDoc({comps:[],lines:[],texts:[],shapes:[]}); toast('Feuille vidée. Ctrl+Z pour revenir en arrière.') };
$('#b-example').onclick=()=>{ loadDoc(example()) };
$('#b-undo').onclick=undo; $('#b-redo').onclick=redo;
$('#b-zin').onclick=()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,1.25);
$('#b-zout').onclick=()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,0.8);
$('#zoomv').onclick=()=>zoomAt(svg.clientWidth/2,svg.clientHeight/2,1/view.z);
$('#b-fit').onclick=fit;
const fsBtn=$('#b-fs'); if(!document.fullscreenEnabled) fsBtn.hidden=true;
fsBtn.onclick=async()=>{ try{ if(document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen() }catch(e){ toast("Le plein écran n'est pas disponible ici. Essayez la touche F11.") } };
document.addEventListener('fullscreenchange',()=>{ fsBtn.setAttribute('aria-pressed',String(!!document.fullscreenElement)); renderAll() });
window.addEventListener('resize',()=>renderAll());

/* ---------- Exemple de départ : les stations prédéfinies, avec titres et un cadre ---------- */
function example(){
  const saved=doc, savedSeq=seq; doc={comps:[],lines:[],texts:[],shapes:[]}; seq=1;
  let y=0, x1=1e9, x2=-1e9, y1=1e9;
  for(const st of PRESETS_ST){ const it=normDoc(clone(st.items)), b=itemsBox(it); if(!b) continue;
    const oy=Math.round((y-b.y1)/G)*G; insertItems(it,0,oy);
    doc.texts.push({id:'t'+seq++,x:Math.round(b.x1/G)*G,y:y-14,text:st.name,size:13,color:INK,bold:true});
    x1=Math.min(x1,b.x1); x2=Math.max(x2,b.x2); y1=Math.min(y1,y-30); y+=b.y2-b.y1+90 }
  if(doc.comps.length){
    doc.texts.unshift({id:'t'+seq++,x:Math.round((x1-20)/G)*G,y:y1-30,text:'Stations de vannes (exemple)',size:16,color:INK,bold:true});
    doc.shapes.push({id:'s'+seq++,k:'rect',x:Math.round((x1-40)/G)*G,y:Math.round((y1-60)/G)*G,w:Math.round((x2-x1+80)/G)*G,h:Math.round((y-y1+10)/G)*G,color:'#6b7280',width:1,dash:'dash',tint:false,r:true,text:''}) }
  const d=doc; doc=saved; seq=savedSeq; return d }

/* ---------- Démarrage ---------- */
buildPalette();
let restored=false;
try{ const s=localStorage.getItem(KEY); if(s){ const d=normDoc(JSON.parse(s)); if(d.comps.length||d.lines.length||d.texts.length||d.shapes.length){ doc=d; restored=true } } }catch(e){}
if(!restored) doc=example();
resetSeq(); hist=[snapshot()]; hi=0; updUndo(); buildPanel(); status();
requestAnimationFrame(()=>{ fit(); if(!restored) toast("Exemple chargé. Modifiez-le ou cliquez sur Nouveau pour repartir de zéro.") });
})();
</script>
